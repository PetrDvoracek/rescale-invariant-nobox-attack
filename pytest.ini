[pytest]
# Register the `gpu` marker so `pytest -m 'not gpu'` works and unknown-marker
# warnings do not fire (PROGRAM.md §10 — CPU-first testing). The whole suite is
# CPU-only and network-free; anything needing CUDA carries @pytest.mark.gpu.
testpaths = tests
markers =
    gpu: tests that require CUDA; skipped on CPU-only boxes and excluded from the CPU CI job.
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
