name: CI

# CPU-only CI (GitHub-hosted runners have no GPU). Runs a dependency-light lint
# smoke + the non-gpu pytest suite (PROGRAM.md §6.0/§10). The PAPER_MAP resolver
# runs as part of pytest (tests/test_paper_map.py).
#
# NOTE: timm and albumentations are the two fragile, number-moving pins
# (PROGRAM.md §11). Keep the versions installed here matching
# docker/requirements.txt.

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    name: lint + pytest (CPU, not gpu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU torch wheels (GitHub runners are CPU-only).
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.2.0 torchvision==0.17.0
          # Core deps — timm/albumentations versions MUST match docker/requirements.txt.
          pip install \
            timm==0.9.2 \
            segmentation-models-pytorch==0.3.3 \
            lightning==2.2.0.post0 \
            albumentations==1.3.1 \
            torchmetrics==1.9.0 \
            opencv-python-headless==4.8.0.74 \
            scikit-image==0.25.2 \
            typer==0.9.0 \
            pyyaml \
            pytest

      - name: Lint smoke (dependency-free compile check)
        run: python -m compileall rina cli.py lib.py

      - name: Run CPU test suite (excludes gpu-marked tests)
        run: python -m pytest -m 'not gpu' -q
